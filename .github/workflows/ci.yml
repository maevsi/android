name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@66040b4567381bad6e0b9a68caa17643e1d365bd # 5.10.0
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        cache: gradle
        distribution: temurin
        java-version: 25.0.5+8.0.LTS
    - name: Lint and build the release variant
      run: ./gradlew lint assembleRelease
  release_semantic:
    needs: build
    if: github.event_name == 'push'
    name: Release (semantic)
    uses: dargmuesli/github-actions/.github/workflows/release-semantic.yml@66040b4567381bad6e0b9a68caa17643e1d365bd # 5.10.0
    permissions:
      contents: write
      id-token: write
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      EXTRA_PLUGINS: |
        semantic-release-replace-plugin
  release:
    needs: release_semantic
    if: github.ref_name == 'main' && needs.release_semantic.outputs.new_release_version != null
    name: Sign and release to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.release_semantic.outputs.new_release_version }}
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        cache: gradle
        distribution: temurin
        java-version: 25.0.5+8.0.LTS
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
    - name: Build, sign, and publish the release bundle to Google Play
      env:
        UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      run: |
        echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        ./gradlew publishReleaseBundle \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
          -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias=upload \
          -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"
