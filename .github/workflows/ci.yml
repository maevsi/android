name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

# Release branches queue instead of being cancelled, so a release never stops halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/alpha", "refs/heads/beta", "refs/heads/main"]'), github.ref) }}

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@ab8e226263168a9aab8c98d6db89ce707f77497e # 5.11.0
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        cache: gradle
        distribution: temurin
        java-version: 25.0.5+100000002.0.LTS
    - name: Lint and build the release variant
      run: ./gradlew lint assembleRelease
  release_semantic:
    needs: build
    if: github.event_name == 'push'
    name: Release (semantic)
    uses: dargmuesli/github-actions/.github/workflows/release-semantic.yml@ab8e226263168a9aab8c98d6db89ce707f77497e # 5.11.0
    permissions:
      contents: write
      id-token: write
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      EXTRA_PLUGINS: |
        semantic-release-replace-plugin
  release:
    needs: release_semantic
    if: github.ref_name == 'main' && needs.release_semantic.outputs.new_release_version != null
    name: Sign and upload to Google Play's internal track
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: internal
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ needs.release_semantic.outputs.new_release_version }}
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        cache: gradle
        distribution: temurin
        java-version: 25.0.5+100000002.0.LTS
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
    - name: Build, sign, and upload the release bundle to the internal track
      env:
        UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      run: |
        echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        ./gradlew publishReleaseBundle \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
          -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias=upload \
          -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"
  promote:
    needs: [release_semantic, release]
    name: Promote to production
    uses: ./.github/workflows/promote.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release_semantic.outputs.new_release_version }}
