name: Promote

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release-notes-de:
        description: German release notes, at most 500 characters
        required: true
        type: string
      release-notes-en:
        description: English release notes, at most 500 characters
        required: true
        type: string

jobs:
  promote:
    name: Promote the internal release to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        cache: gradle
        distribution: temurin
        java-version: 25.0.5+8.0.LTS
    - name: Write the release notes
      env:
        RELEASE_NOTES_DE: ${{ inputs.release-notes-de }}
        RELEASE_NOTES_EN: ${{ inputs.release-notes-en }}
      run: |
        write_notes() {
          if [ -z "$2" ] || [ "${#2}" -gt 500 ]; then
            echo "::error::The $1 release notes must hold 1 to 500 characters."
            exit 1
          fi
          mkdir -p "app/src/main/play/release-notes/$1"
          printf '%s\n' "$2" > "app/src/main/play/release-notes/$1/default.txt"
        }
        write_notes de-DE "$RELEASE_NOTES_DE"
        write_notes en-US "$RELEASE_NOTES_EN"
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
    - name: Promote the latest internal release to production
      run: ./gradlew promoteReleaseArtifact --from-track internal --promote-track production
